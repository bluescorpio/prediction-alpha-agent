[package]
name = "alpha_desk"
version = "0.1.0"
edition = "2021"
# Solana CLI 1.18.17 自带的 platform-tools v1.41 用 Rust 1.75 编译程序。
rust-version = "1.75"

[lib]
crate-type = ["cdylib", "lib"]

[features]
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Anchor 0.30.1 发行说明：推荐 Solana CLI 1.18.17，支持 1.17.3 以上。
# https://www.anchor-lang.com/release-notes/0.30.1
anchor-lang = "0.30.1"
